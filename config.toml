# ============================================================
#  天学网单词PK助手 — 配置
#  改完保存即生效，不用动代码。
# ============================================================

[bot]
# 每题限时（秒）。用来算"还剩多少时间可以问 AI"。
# 计分赛实测是 6 秒；如果你那边是 4 秒，就改成 4。
question_seconds = 6.0


[ai]
# 本地词库判不出来时，交给 AI 兜底。
#
# 只有那 ~12% 判不出的题会调用，且答案会被记住，同一个词只问一次。
# 超时预算由界面上的真实倒计时动态决定，不会因为等 AI 而超时。
enabled = true

# chat = 任何 OpenAI 兼容接口（DeepSeek / OpenAI / 本地 Ollama）
# jev  = TypeSafe 官方 Jev 决策模型，最贴合本用途
mode = "jev"

# jev 用官方端点；chat 模式才换成像 https://api.deepseek.com/v1
base_url = "https://api.typesafe.ai/v1"
model    = "jev-latest"

# ⚠ 别把密钥写在这里——本文件是要提交到公开仓库的。
#   已用用户级环境变量 TYPESAFE_API_KEY（配置会自己读）。
#   也可以临时用 PK_API_KEY 覆盖。
api_key  = ""

# 单次调用上限（秒）。实际会取「这个值」和「界面剩余时间」里更小的那个。
# 本机实测 Jev 一次约 0.8-0.9 秒。
timeout = 1.8

# 把 AI 给出的答案记进 data/learned.json，下次直接命中、不再请求。
# 这是这套兜底最划算的地方：同一个词只需要问 AI 一次。
remember = true


[score]
# 控分：让最终正确率贴近目标，不至于高得扎眼。
enabled = false
target_accuracy = 0.70     # 目标正确率，0-1（写 70 也会被当成 70%）
